<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><defs></defs><rect width="1600" height="1000" fill="#f1efe9"/><text x="110" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="260" font-weight="800" letter-spacing="-14" fill="#0e0e0c">Aa</text><text x="560" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5f5c55">Kite Grotesk — Bold, Medium, Regular</text><text x="560" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0e0e0c">Ride now. Pay per minute.</text><text x="560" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#0e0e0c">Unlock with one tap, park anywhere marked blue.</text><rect x="110" y="560" width="200" height="300" rx="24" fill="#2b36f5"/><text x="130" y="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#fff">Kite Blue</text><rect x="340" y="560" width="200" height="300" rx="24" fill="#d4ff3f"/><text x="360" y="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#0e0e0c">Signal</text><rect x="570" y="560" width="200" height="300" rx="24" fill="#0e0e0c"/><text x="590" y="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#fff">Asphalt</text><rect x="800" y="560" width="200" height="300" rx="24" fill="#e9ecff"/><text x="820" y="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#0e0e0c">Air</text><g transform="translate(1100 560)"><rect width="390" height="300" rx="24" fill="#fff"/><path d="M195 40 L300 150 L195 260 L90 150 Z" fill="#2b36f5"/><path d="M195 40 V260 M90 150 H300" stroke="#fff" stroke-width="5"/></g></svg>
