<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../css/tailwind.css" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order confirmed — Lumen Goods</title>
<meta name="description" content="Your Lumen Goods order is in." />
<style>:focus-visible { outline: 2px solid #5c1a3a; outline-offset: 3px; } [aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }</style>
</head>
<body class="bg-[#fff7f2] text-[#2a1420] font-sans antialiased">
<header class="sticky top-0 z-30 border-b border-[#ead9cf] bg-[#fff7f2]/95 backdrop-blur">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-5 py-4 sm:px-8">
    <a href="index.html" class="font-display text-2xl">Lumen Goods</a>
    <div class="flex items-center gap-3">
      <a href="bag.html" class="rounded-full bg-[#5c1a3a] px-4 py-2 text-sm text-[#fff6ef]">Bag <span data-bag-count class="ml-1 inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-[#f0c9a0] px-1 text-xs text-[#5c1a3a]">0</span></a>
      <button id="menuBtn" class="rounded-full border border-[#ead9cf] px-3 py-1 text-sm md:hidden" aria-expanded="false">Menu</button>
    </div>
    <nav id="nav" class="hidden basis-full flex-col gap-3 border-t border-[#ead9cf] pt-3 text-sm md:flex md:basis-auto md:flex-row md:gap-7 md:border-0 md:pt-0 flex"><a href="index.html">Shop</a><a href="about.html">About</a><a href="shipping.html">Shipping</a><a href="bag.html">Bag</a></nav>
  </div>
</header>
<main class="mx-auto max-w-3xl px-5 py-16 sm:px-8"><div id="confirmation"></div><p class="mt-8"><a class="underline underline-offset-4" href="index.html">Continue in the shop</a></p></main>
<footer class="border-t border-[#ead9cf]">
  <div class="mx-auto grid max-w-6xl gap-6 px-5 py-10 text-sm text-[#7a5564] sm:px-8 md:grid-cols-3">
    <div><p class="font-display text-2xl text-[#2a1420]">Lumen Goods</p><p class="mt-2">18 Calder Street<br />Hudson, New York 12534</p></div>
    <div><p>Open Thursday to Sunday, 11:00–17:00. The online desk ships Monday to Wednesday.</p><p class="mt-2"><span class="underline underline-offset-4" >hello@lumengoods.com</span></p></div>
    <div class="space-y-1"><a href="shipping.html">Shipping and returns</a><br /><a href="about.html">The shop</a><br /><a href="bag.html">Your bag</a></div>
  </div>
</footer>

<script>
const menuBtn = document.getElementById("menuBtn");
const siteNav = document.getElementById("nav");
if (menuBtn && siteNav) {
  menuBtn.addEventListener("click", () => {
    const open = siteNav.classList.toggle("hidden") === false;
    menuBtn.setAttribute("aria-expanded", String(open));
    menuBtn.textContent = open ? "Close" : "Menu";
  });
}
</script>
<script src="shop.js"></script>

</body>
</html>
