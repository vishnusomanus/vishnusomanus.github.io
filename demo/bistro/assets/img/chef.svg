  <path d="M200 350c-10-110 60-170 110-168 70 2 120 60 100 170-10-50-40-90-100-96-60 6-90 40-110 94z" fill="#1f130d"/>
  <circle cx="300" cy="190" r="38" fill="#1f130d"/>
  <!-- face -->
  <g fill="#2a1810"><ellipse cx="262" cy="365" rx="8" ry="10"/><ellipse cx="338" cy="365" rx="8" ry="10"/></g>
  <path d="M248 340c10-8 24-8 32 0M320 340c10-8 24-8 32 0" stroke="#2a1810" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M300 372c-6 22-6 32 6 36" stroke="#6e3f26" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M270 425c18 14 42 14 60 0" stroke="#5a2a1a" stroke-width="6" stroke-linecap="round" fill="none"/>
  <g fill="#c4532d" opacity=".25"><circle cx="245" cy="400" r="16"/><circle cx="355" cy="400" r="16"/></g>
  <circle cx="201" cy="372" r="10" fill="#cfa862"/>
