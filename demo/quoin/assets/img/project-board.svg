  <path d="M130 268v6m10-6v4m10-4v6m10-6v4m10-4v6m10-6v4m10-4v6m10-6v4m10-4v6m10-6v4m10-4v6m10-6v4m10-4v6m10-6v4m10-4v6m10-6v4m10-4v6" stroke="#514f3f"/>
  <rect x="290" y="250" width="58" height="50" rx="10" fill="#354d3c" stroke="#2f4335" stroke-width="2"/>
  <circle cx="319" cy="275" r="12" fill="#4b6a52" stroke="#2f4335"/>
  <path d="M290 270h-6v12h6" fill="#3d3a30"/>
