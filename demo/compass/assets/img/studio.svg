    <path d="M210 292h380" stroke="#d39226" stroke-width="7"/>
    <path d="M250 292c40-82 260-82 300 0" fill="none" stroke="#e6ab3d" stroke-width="8"/>
    <g stroke="#e6ab3d" stroke-width="2.5"><path d="M290 292v-38M330 292v-55M370 292v-64M410 292v-64M450 292v-55M490 292v-38M520 292v-20M280 292v-24"/></g>
    <path d="M246 292v40M554 292v40" stroke="#d39226" stroke-width="9"/>
