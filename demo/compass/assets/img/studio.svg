    <clipPath id="win"><rect x="210" y="40" width="380" height="330" rx="6"/></clipPath>
  </defs>
  <rect width="800" height="560" fill="#efe7da"/>
  <rect y="420" width="800" height="140" fill="#e4d8c5"/>
  <!-- window view -->
  <g clip-path="url(#win)">
