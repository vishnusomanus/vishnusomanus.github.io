<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t">
  <title id="t">Illustration of the Bearing studio: two armchairs and a small table in front of a tall window looking out over a river and a yellow arch bridge</title>
  <defs>
