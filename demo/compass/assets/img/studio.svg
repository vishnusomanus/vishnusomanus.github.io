  <g><rect x="648" y="62" width="14" height="48" fill="#364070"/><rect x="664" y="70" width="12" height="40" fill="#c98a70"/><rect x="678" y="58" width="16" height="52" fill="#e6ab3d"/><rect x="698" y="76" width="40" height="12" rx="2" fill="#8d9a76" transform="rotate(-8 718 82)"/><rect x="700" y="92" width="44" height="18" fill="#cfbfa6"/></g>
  <rect x="640" y="200" width="110" height="10" rx="3" fill="#fbf8f3"/>
