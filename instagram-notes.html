        content: attr(data-label);
        font-family: "JetBrains Mono", ui-monospace, monospace;

        table-layout: fixed;

      .notes-table th:nth-child(1),

      .notes-table td:nth-child(3) { width: 32%; }

      .notes-table td:nth-child(4) { width: 14%; }
      .notes-table th:nth-child(5),
      .notes-table td:nth-child(5) { width: 14%; }
    }
  </style>

<body class="min-h-screen text-on-surface font-sans antialiased pb-[env(safe-area-inset-bottom)]">
  <header class="border-b border-white/5 sticky top-0 z-20 bg-background/80 backdrop-blur-md pt-[env(safe-area-inset-top)]">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 sm:py-4">

  <script type="text/plain" id="apps-script-source">
const SHEET_ID = "1OtTTKI_xm9zx9_rkI3nVqtoxF1SA3l03XiQW4ORl0EQ";

function getSheet() {
  return SpreadsheetApp.openById(SHEET_ID).getSheets()[0];
}

function listRows() {
  const sheet = getSheet();
  const last = sheet.getLastRow();
  if (last < 2) return { ok: true, rows: [] };
  const values = sheet.getRange(2, 1, last - 1, 5).getDisplayValues();
  const rows = [];
  for (var i = 0; i < values.length; i++) {
    var r = values[i];
    var row = {
      row: i + 2,
      username: String(r[0] || "").trim(),
      name: String(r[1] || "").trim(),
      note: String(r[2] || "").trim(),
      date: String(r[3] || "").trim(),
      status: String(r[4] || "").trim()
    };
    if (row.username || row.name || row.note || row.date || row.status) rows.push(row);
  }
  return { ok: true, rows: rows };
}

function saveRow(params) {
  const sheet = getSheet();
  sheet.appendRow([
    String(params.username || "").trim(),
    String(params.name || "").trim(),
    String(params.note || "").trim(),
    String(params.date || "").trim()
  ]);
  return { ok: true, action: "added", row: sheet.getLastRow() };
}

function output(payload) {
  return ContentService.createTextOutput(JSON.stringify(payload)).setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  try {
    var action = e && e.parameter && e.parameter.action ? String(e.parameter.action).toLowerCase() : "list";
    if (action === "save") return output(saveRow(e.parameter || {}));
    return output(listRows());
  } catch (err) {
    return output({ ok: false, error: String(err) });
  }
}

function doPost(e) {
  try {
    return output(saveRow((e && e.parameter) || {}));
  } catch (err) {
    return output({ ok: false, error: String(err) });
  }
}
  </script>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1Rb47UDt6ruaC2JVaoCUGHBVODoVgOY280F6GE7pO4v95EsuNEHH4xMZBRxv_38Jt/exec";

    const els = {
      form: document.getElementById("entry-form"),
      formStatus: document.getElementById("form-status"),
      submitBtn: document.getElementById("submit-btn"),
      username: document.getElementById("username"),
      name: document.getElementById("name"),
      note: document.getElementById("note"),
      search: document.getElementById("search"),
      rowCount: document.getElementById("row-count"),
      refreshBtn: document.getElementById("refresh-btn"),
      listStatus: document.getElementById("list-status"),
      rowsBody: document.getElementById("rows-body"),
      filters: document.getElementById("filters"),
      nextVideo: document.getElementById("next-video"),
      nextVideoBody: document.getElementById("next-video-body"),
      nextVideoEmpty: document.getElementById("next-video-empty"),
    };

    let rows = [];
    let statusFilter = "all";

    const today = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };
    const scriptUrl = () => APPS_SCRIPT_URL;

    function resetForm() {
      els.form.reset();
      els.formStatus.textContent = "";
    }

    function parseScriptPayload(text) {
      const raw = String(text || "").trim();
      if (!raw) throw new Error("Apps Script returned an empty response. Deploy again as a Web app.");
      if (raw.startsWith("<") || raw.includes("<!DOCTYPE")) {
        throw new Error("Google returned a login page. Redeploy with Who has access = Anyone.");
      }
      const start = raw.indexOf("{");
      const end = raw.lastIndexOf("}");
      if (start < 0 || end < start) throw new Error("Unexpected response from Apps Script.");
      return JSON.parse(raw.slice(start, end + 1));
    }

    async function fetchScript(params, timeoutMs = 12000) {
      const url = scriptUrl();
      if (!url) throw new Error("No Web app URL saved.");
      const endpoint = new URL(url);
      Object.entries(params).forEach(([key, value]) => {
        if (value != null && value !== "") endpoint.searchParams.set(key, value);
      });
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(endpoint.toString(), { method: "GET", redirect: "follow", signal: ctrl.signal });
        const data = parseScriptPayload(await res.text());
        if (!data || data.ok === false) throw new Error((data && data.error) || "Apps Script request failed.");
        return data;
      } catch (err) {
        if (err.name === "AbortError") throw new Error("Request timed out. Check the /exec URL and deploy access.");
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    function showListStatus(message, kind) {
      if (!message) {
        els.listStatus.classList.add("hidden");
        els.listStatus.textContent = "";
        return;
      }
      els.listStatus.classList.remove("hidden");
      els.listStatus.textContent = message;
      els.listStatus.className = "glass rounded-2xl px-4 py-3 text-sm " + (kind === "error" ? "text-red-400" : "text-on-surface-variant");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function emptyMessage() {
      return rows.length ? "No matches." : "No rows yet. Add the first entry.";
    }

    function statusBadge(status) {
      if (!status) return `<span class="text-xs text-outline">Pending</span>`;
      return `<span class="inline-flex max-w-full items-center rounded-full border border-outline-variant px-2 py-0.5 text-[11px] font-medium text-on-surface-variant break-all">${escapeHtml(status)}</span>`;
    }

    function uniqueStatuses() {
      const set = new Set();
      rows.forEach((r) => {
        const status = String(r.status || "").trim();
        if (status) set.add(status);
      });
      return [...set].sort((a, b) => a.localeCompare(b));
    }

    function pendingCount() {
      return rows.filter((r) => !String(r.status || "").trim()).length;
    }

    function nextVideoRow() {
      return rows.find((r) => !String(r.status || "").trim()) || null;
    }

    function filterChipClass(active) {
      return "filter-chip rounded-full px-3 py-1.5 min-h-[36px] text-xs font-medium transition-colors " +
        (active
          ? "bg-electric-blue text-white"
          : "border border-outline-variant text-on-surface-variant hover:text-on-surface hover:border-electric-blue");
    }

    function renderFilters() {
      const statuses = uniqueStatuses();
      const pending = pendingCount();
      const chips = [
        { value: "all", label: `All (${rows.length})` },
        { value: "pending", label: `Pending (${pending})` },
        ...statuses.map((status) => {
          const count = rows.filter((r) => r.status === status).length;
          return { value: status, label: `${status} (${count})` };
        }),
      ];
      els.filters.innerHTML = chips.map((chip) => `
        <button type="button" class="${filterChipClass(statusFilter === chip.value)}" data-status="${escapeHtml(chip.value)}" aria-pressed="${statusFilter === chip.value}">
          ${escapeHtml(chip.label)}
        </button>
      `).join("");
    }

    function filteredRows() {
      const q = els.search.value.trim().toLowerCase();
      return rows.filter((r) => {
        const status = String(r.status || "").trim();
        if (statusFilter === "pending" && status) return false;
        if (statusFilter !== "all" && statusFilter !== "pending" && status !== statusFilter) return false;
        if (!q) return true;
        return [r.username, r.name, r.note, r.date, r.status].join(" ").toLowerCase().includes(q);
      });
    }

    function renderNextVideo() {
      const next = nextVideoRow();
      if (!rows.length) {
        els.nextVideo.classList.add("hidden");
        els.nextVideoEmpty.classList.add("hidden");
        return;
      }
      if (!next) {
        els.nextVideo.classList.add("hidden");
        els.nextVideoEmpty.classList.remove("hidden");
        els.nextVideoBody.innerHTML = "";
        return;
      }
      els.nextVideoEmpty.classList.add("hidden");
      els.nextVideo.classList.remove("hidden");
      els.nextVideoBody.innerHTML = `
        <div class="grid sm:grid-cols-2 gap-3 text-sm">
          <div>
            <p class="font-mono text-[10px] uppercase tracking-wider text-on-surface-variant mb-1">Instagram Username</p>
            <p class="font-medium break-words">${escapeHtml(next.username) || "—"}</p>
          </div>
          <div>
            <p class="font-mono text-[10px] uppercase tracking-wider text-on-surface-variant mb-1">Name Need to say in video</p>
            <p class="font-semibold text-base break-words">${escapeHtml(next.name) || "—"}</p>
          </div>
        </div>
        <div>
          <p class="font-mono text-[10px] uppercase tracking-wider text-on-surface-variant mb-1">Dialogue / Note</p>
          <p class="text-sm text-on-surface-variant whitespace-pre-wrap break-words">${escapeHtml(next.note) || "—"}</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <p class="font-mono text-xs text-outline">${escapeHtml(next.date) || "No date"}</p>
          <button type="button" id="copy-next-name" class="inline-flex items-center gap-1 rounded-lg border border-outline-variant min-h-[40px] px-3 text-xs text-on-surface-variant hover:text-on-surface hover:border-electric-blue transition-colors">
            <span class="material-symbols-outlined text-[16px]">content_copy</span>
            Copy name
          </button>
          <button type="button" id="copy-next-note" class="inline-flex items-center gap-1 rounded-lg border border-outline-variant min-h-[40px] px-3 text-xs text-on-surface-variant hover:text-on-surface hover:border-electric-blue transition-colors">
            <span class="material-symbols-outlined text-[16px]">content_copy</span>
            Copy note
          </button>
        </div>
      `;
      const copy = async (text, btn) => {
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          const label = btn.textContent;
          btn.lastChild.textContent = " Copied";
          setTimeout(() => { btn.lastChild.textContent = label.replace(/^\s*/, " "); }, 1200);
        } catch {}
      };
      document.getElementById("copy-next-name")?.addEventListener("click", (e) => copy(next.name, e.currentTarget));
      document.getElementById("copy-next-note")?.addEventListener("click", (e) => copy(next.note, e.currentTarget));
    }

    function renderRows() {
      const filtered = filteredRows();
      const next = nextVideoRow();
      const active = statusFilter !== "all" || els.search.value.trim();
      els.rowCount.textContent = active
        ? `${filtered.length} of ${rows.length}`
        : `${rows.length} ${rows.length === 1 ? "entry" : "entries"}`;

      renderFilters();
      renderNextVideo();

      if (!filtered.length) {
        els.rowsBody.innerHTML = `<tr class="is-placeholder"><td colspan="5" class="px-4 py-10 text-center text-on-surface-variant">${emptyMessage()}</td></tr>`;
        return;
      }

      els.rowsBody.innerHTML = filtered.map((r) => {
        const isNext = next && r.row === next.row;
        return `
        <tr class="xl:hover:bg-white/[0.03] ${isNext ? "ring-1 ring-inset ring-electric-blue/40 bg-electric-blue/[0.06]" : ""}">
          <td class="px-4 py-3 font-medium" data-label="Username">${escapeHtml(r.username) || "—"}</td>
          <td class="px-4 py-3 font-medium" data-label="Name Need to say in video">${escapeHtml(r.name) || "—"}</td>
          <td class="px-4 py-3 text-on-surface-variant" data-label="Note"><span class="xl:line-clamp-3 whitespace-pre-wrap">${escapeHtml(r.note) || "—"}</span></td>
          <td class="px-4 py-3 font-mono text-xs" data-label="Date">${escapeHtml(r.date) || "—"}</td>
          <td class="px-4 py-3" data-label="Status">${statusBadge(r.status)}</td>
        </tr>
      `;
      }).join("");
    }

    async function loadRows() {
      els.rowsBody.innerHTML = `<tr class="is-placeholder"><td colspan="5" class="px-4 py-10 text-center text-on-surface-variant">Loading…</td></tr>`;
      try {
        const data = await fetchScript({ action: "list" });
        rows = (data.rows || []).map((r) => ({
          row: r.row,
          username: r.username || "",
          name: r.name || "",
          note: r.note || "",
          date: r.date || "",
          status: r.status || r.Status || "",
        }));
        showListStatus("");
        renderRows();
      } catch (err) {
        rows = [];
        showListStatus(err.message || "Could not load rows.", "error");
        renderRows();
      }
    }

    async function saveEntry(payload) {
      const url = scriptUrl();
      const params = new URLSearchParams({
        action: "save",
        username: payload.username,
        name: payload.name,
        note: payload.note,
        date: payload.date,
      });

      try {
        return await fetchScript(Object.fromEntries(params.entries()));
      } catch {
        await fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params,
        });
        await new Promise((r) => setTimeout(r, 1200));
        return { ok: true, action: "added" };
      }
    }

    els.form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!els.form.checkValidity()) {
        els.form.reportValidity();
        return;
      }
      const payload = {
        username: els.username.value.trim(),
        name: els.name.value.trim(),
        note: els.note.value.trim(),
        date: today(),
      };
      const label = els.submitBtn.textContent;
      els.submitBtn.disabled = true;
      els.submitBtn.textContent = "Saving…";
      els.formStatus.textContent = "";
      els.formStatus.className = "font-mono text-xs min-h-[1rem]";
      try {
        await saveEntry(payload);
        els.formStatus.textContent = "Row added.";
        els.formStatus.classList.add("text-electric-blue");
        resetForm();
        await loadRows();
      } catch (err) {
        els.formStatus.textContent = err.message || "Could not save.";
        els.formStatus.classList.add("text-red-400");
      } finally {
        els.submitBtn.disabled = false;
        els.submitBtn.textContent = label;
      }
    });

    els.search.addEventListener("input", renderRows);
    els.filters.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-status]");
      if (!btn) return;
      statusFilter = btn.dataset.status;
      renderRows();
    });
    els.refreshBtn.addEventListener("click", loadRows);

    loadRows();
  </script>
</body>
</html>
